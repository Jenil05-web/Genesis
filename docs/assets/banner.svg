<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Genesis — Autonomous Disaster Response and Recovery Orchestrator">
  <defs>
    <path id="borderPath" d="M0.5,0.5 H1199.5 V299.5 H0.5 Z" fill="none"/>
    <radialGradient id="radarGrad" cx="0%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#F5A623" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F5A623" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="#0B1220"/>

  <g stroke="#22304A" stroke-width="1" fill="none">
    <path d="M780,36 C900,8 1045,58 1082,148 C1112,222 1042,270 940,258">
      <animate attributeName="opacity" values="0.7;0.35;0.7" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M762,66 C872,48 992,88 1022,158 C1046,214 990,250 908,240">
      <animate attributeName="opacity" values="0.7;0.35;0.7" dur="5s" begin="0.4s" repeatCount="indefinite"/>
    </path>
    <path d="M748,96 C842,86 940,112 964,166 C984,206 946,230 886,224">
      <animate attributeName="opacity" values="0.7;0.35;0.7" dur="5s" begin="0.8s" repeatCount="indefinite"/>
    </path>
    <path d="M738,124 C816,118 894,138 914,174 C930,200 900,216 858,212">
      <animate attributeName="opacity" values="0.7;0.35;0.7" dur="5s" begin="1.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- radar sweep, centered over the contour cluster -->
  <g>
    <path d="M960,150 L960,45 A105,105 0 0,1 1035,80 Z" fill="url(#radarGrad)">
      <animateTransform attributeName="transform" type="rotate" from="0 960 150" to="360 960 150" dur="7s" repeatCount="indefinite"/>
    </path>
    <circle cx="960" cy="150" r="2" fill="#F5A623" opacity="0.8"/>
  </g>

  <g stroke="#2A3550" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="10"/><line x1="100" y1="0" x2="100" y2="10"/>
    <line x1="160" y1="0" x2="160" y2="10"/><line x1="220" y1="0" x2="220" y2="10"/>
    <line x1="280" y1="0" x2="280" y2="10"/><line x1="340" y1="0" x2="340" y2="10"/>
    <line x1="400" y1="0" x2="400" y2="10"/><line x1="460" y1="0" x2="460" y2="10"/>
    <line x1="520" y1="0" x2="520" y2="10"/><line x1="580" y1="0" x2="580" y2="10"/>
    <line x1="640" y1="0" x2="640" y2="10"/><line x1="700" y1="0" x2="700" y2="10"/>
    <line x1="760" y1="0" x2="760" y2="10"/><line x1="820" y1="0" x2="820" y2="10"/>
    <line x1="880" y1="0" x2="880" y2="10"/><line x1="940" y1="0" x2="940" y2="10"/>
    <line x1="1000" y1="0" x2="1000" y2="10"/><line x1="1060" y1="0" x2="1060" y2="10"/>
    <line x1="1120" y1="0" x2="1120" y2="10"/><line x1="1160" y1="0" x2="1160" y2="10"/>
  </g>

  <!-- scanline sweeping across the top tick strip -->
  <rect y="0" width="2" height="10" fill="#F5A623" opacity="0.85">
    <animate attributeName="x" values="30;1150;30" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.85;0.85;0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <g stroke="#2A3550" stroke-width="1">
    <line x1="40" y1="300" x2="40" y2="290"/><line x1="160" y1="300" x2="160" y2="290"/>
    <line x1="280" y1="300" x2="280" y2="290"/><line x1="400" y1="300" x2="400" y2="290"/>
    <line x1="520" y1="300" x2="520" y2="290"/><line x1="640" y1="300" x2="640" y2="290"/>
    <line x1="760" y1="300" x2="760" y2="290"/><line x1="880" y1="300" x2="880" y2="290"/>
    <line x1="1000" y1="300" x2="1000" y2="290"/><line x1="1120" y1="300" x2="1120" y2="290"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" fill="none" stroke="#22304A" stroke-width="1"/>

  <!-- small monitor dot tracing the full border, slow loop -->
  <circle r="2.5" fill="#F5A623">
    <animateMotion dur="16s" repeatCount="indefinite">
      <mpath xlink:href="#borderPath"/>
    </animateMotion>
    <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>

  <g fill="#5B6785" font-family="IBM Plex Mono, Consolas, monospace" font-size="10" letter-spacing="1">
    <text x="40" y="24">26.40°N</text>
    <text x="280" y="24">93.25°E</text>
    <text x="520" y="24">19.07°N</text>
    <text x="760" y="24">72.87°E</text>
    <text x="1000" y="24">GRID·05</text>
  </g>

  <text x="60" y="128" font-family="Space Grotesk, Arial, sans-serif" font-size="62" font-weight="700" fill="#E8ECF4" letter-spacing="0.5">GENESIS</text>
  <rect x="61" y="144" width="230" height="4" fill="#F5A623"/>
  <rect y="144" width="26" height="4" fill="#FFD37A" opacity="0.9">
    <animate attributeName="x" values="61;265;61" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="60" y="177" font-family="IBM Plex Mono, Consolas, monospace" font-size="14" fill="#8A93AC" letter-spacing="2">AUTONOMOUS DISASTER RESPONSE &amp; RECOVERY ORCHESTRATOR</text>

  <g font-family="IBM Plex Mono, Consolas, monospace" font-size="12" letter-spacing="0.5">
    <rect x="60" y="212" width="140" height="30" rx="3" fill="#141C2E" stroke="#2A3550"/>
    <circle cx="78" cy="227" r="4" fill="#F5A623">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="90" y="231" fill="#E8ECF4">AGENTS·05</text>

    <rect x="212" y="212" width="216" height="30" rx="3" fill="#141C2E" stroke="#2A3550"/>
    <circle cx="230" cy="227" r="4" fill="#E5484D">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <text x="242" y="231" fill="#E8ECF4">HUMAN-APPROVAL GATED</text>

    <rect x="440" y="212" width="168" height="30" rx="3" fill="#141C2E" stroke="#2A3550"/>
    <circle cx="458" cy="227" r="4" fill="#3FB27F">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="470" y="231" fill="#E8ECF4">RAG-GROUNDED</text>
  </g>
</svg>
